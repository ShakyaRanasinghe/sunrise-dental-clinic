name: Deploy - dev

# Deploys the frontend to the Firebase Hosting "dev" channel on every push to develop.
# Gated: no-ops cleanly until the frontend exists and the FIREBASE_SERVICE_ACCOUNT secret
# is configured, so it never produces a red run before those are ready.
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Build and deploy to dev channel
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: pre
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -f frontend/package.json ] && [ -n "$SA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy - frontend and/or FIREBASE_SERVICE_ACCOUNT not yet configured."
          fi

      - name: Set up Node
        if: steps.pre.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        if: steps.pre.outputs.ready == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting dev channel
        if: steps.pre.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sunrise-dental-clinic
          channelId: dev
