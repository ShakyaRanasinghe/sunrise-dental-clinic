name: Release

# Packages the WAR and attaches it to a tag.
#
# This replaced three Firebase Hosting workflows that ran `npm ci` in a frontend/
# directory and pushed static files to a hosting channel. The application is a
# single WAR rendering its own pages on the server - there is no frontend to build
# and nothing to push to a CDN, so those workflows described a project this is not.
# They were gated to skip cleanly, which meant they went on being wrong quietly.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Package the WAR
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        working-directory: modular
        run: mvn -B --no-transfer-progress package

      - name: Attach the WAR to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: modular/target/clinic.war
          generate_release_notes: true
