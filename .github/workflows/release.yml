name: Release

# Packages the WAR and attaches it to a tag. Runs for any v* tag push and by
# hand from the Actions tab (workflow_dispatch). For tag pushes GitHub resolves
# this workflow file from the tagged commit itself — which is why the file also
# exists on prod, the branch the release tags point at.
#
# Before packaging, the released prod code is verified identical to the latest
# qa_v* tag: every file prod ships that also exists on the QA tag must be
# byte-identical. Files that only exist on QA (docs, frontend/,
# scripts/, dev testimony — intentionally absent from prod) are ignored; the
# check is exactly "did the passed candidate's deployable code reach prod".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  verify:
    name: Verify prod matches the latest QA tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the latest QA tag
        id: candidate
        run: |
          qa_tag=$(git tag --list 'qa_v*' --sort=-v:refname | head -n1)
          if [ -z "$qa_tag" ]; then
            echo "::error::no qa_v* tag found to compare against"
            exit 1
          fi
          echo "Latest QA tag: ${qa_tag}"
          echo "tag=${qa_tag}" >> "$GITHUB_OUTPUT"

      # HEAD is the pushed tag (prod code). Walk every file the QA tag carries;
      # for the ones prod also ships (the deployable code, plus .gitignore), they
      # must be byte-identical. prod-only files (deploy/, render.yaml) are never
      # compared because nothing on QA corresponds to them; .github/ CI infra is
      # not QA'd product code, so it is skipped too.
      - name: Every prod file must match the last QA-passed candidate
        env:
          QA_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          mismatch=0
          while read -r f; do
            case "$f" in
              .github/*) continue ;;  # CI/Release infra, not QA'd product code
            esac
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              if ! git diff --quiet --exit-code "${QA_TAG}^{}" HEAD -- "$f"; then
                echo "::error::$f differs between ${QA_TAG} and prod"
                mismatch=1
              fi
            fi
          done < <(git ls-tree -r --name-only "${QA_TAG}^{}")
          if [ "$mismatch" -ne 0 ]; then
            echo "::error::prod code is not identical to the QA-passed candidate ${QA_TAG}"
            exit 1
          fi
          echo "prod code matches ${QA_TAG} (docs/dev-only files absent from prod are ignored)"

  release:
    name: Package the WAR
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        working-directory: modular
        run: mvn -B --no-transfer-progress package

      - name: Attach the WAR to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: modular/target/clinic.war
          generate_release_notes: true