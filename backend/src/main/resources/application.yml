spring:
  application:
    name: sunrise-dental-clinic

# Business configuration (all overridable per environment)
clinic:
  billing:
    service-charge: 200          # Rs, receptionist's handling fee
  revenue:
    dentist-treatment-share: 0.60  # dentist keeps 60% of treatment cost, clinic 40%
  mail:
    enabled: false               # set true + configure spring.mail.* to send real email

# Springdoc / Swagger UI at /swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
