# =====================================================================
#  Sunrise Dental Clinic — application settings
#
#  Every key below can be overridden by an environment variable named
#  after it: upper-cased, with dots replaced by underscores. So db.url
#  is overridden by DB_URL. That is how the same WAR is deployed to dev,
#  QA and production without being rebuilt — and how the production
#  database password stays out of version control.
# =====================================================================

# --- Database -------------------------------------------------------
# The default below assumes a conventional MySQL on 3306. The local Docker
# setup publishes on 3308 instead, because the host's own mysqld holds 3306 -
# scripts/dev-up.sh passes DB_URL accordingly. See docs/local-setup.md.
db.url=jdbc:mysql://localhost:3306/sunrise_dental?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=
# Connections held open and lent to requests. Eight is ample for a single
# practice; raise it only if requests are seen waiting for a connection.
db.pool.size=8

# --- Where the clinic is --------------------------------------------
# The clinic's own timezone, and the one every date is judged in: which
# day a bill belongs to, and whether an appointment is in the past.
#
# This is not cosmetic. The application is deployed in a container that
# runs UTC, and a clinic in Colombo is +05:30 - so for five and a half
# hours every night, UTC is still on yesterday. An appointment booked for
# today would have its bill counted under yesterday's takings, and the
# report would disagree with the appointment book. Setting this makes
# every date the clinic's date wherever the container happens to run.
clinic.timezone=Asia/Colombo

# --- Billing and the revenue split ----------------------------------
# The front-desk handling charge added to every bill (Rs). This is the
# clinic's margin on top of the dentist's own fees, so raising it raises
# the owner's take and nothing else.
clinic.billing.service-charge=200
#
# Two dials decide where a bill goes. The clinic - the owner - always
# takes exactly what the other two do not, so the three shares sum to
# the bill however these are set.
#
#   consultation fee -> the dentist, in full. The column is the
#                       dentist's own fee, so it is not shared.
#   treatment cost   -> this fraction to the dentist as their
#                       professional fee, remainder to the clinic for
#                       materials and facilities.
clinic.revenue.dentist-treatment-share=0.60
#   service charge   -> this fraction to the receptionist who handled
#                       the bill, remainder to the clinic.
#
# Zero is the default because reception is a salaried role: a commission
# on every bill is unusual for a practice, and it puts an incentive on
# the person who decides what to charge. A clinic that does pay handling
# commission sets 1.0 for the whole charge, or 0.25 for a quarter of it,
# with no code change.
clinic.revenue.receptionist-service-share=0

# --- Notifications --------------------------------------------------
clinic.mail.from=no-reply@sunrisedental.lk

# --- Clinic contact details (shown on the help page) ----------------
clinic.name=Sunrise Dental Clinic
clinic.phone=+94 11 234 5678
clinic.email=hello@sunrisedental.lk
