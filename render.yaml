# Sunrise Dental Clinic — Render Blueprint (no-card, free-tier variant).
#
# Deploy in the Render dashboard: New > Blueprint > connect this repository.
# One service: the web app (Tomcat). The database is external — Aiven for
# MySQL free tier — reached over TLS, so no private service, no disk, and
# no payment method is required on either platform.
#
# The app reads DB_URL / DB_USER / DB_PASSWORD as environment variables and
# overrides the clinic.properties defaults with them — no rebuild required.
#
# Before deploying:
#   1. Create the Aiven for MySQL service (free tier) and note the host,
#      port, database name, user and password from the Aiven console.
#   2. Load the schema once by hand (Aiven does not run init scripts):
#        mysql --default-character-set=utf8mb4 \
#          --host=<aiven-host> --port=<aiven-port> \
#          --user=avnadmin --password=<pw> --ssl-mode=REQUIRED \
#          defaultdb < modular/src/main/resources/schema.sql
#      Then repeat for modular/src/main/resources/procedures.sql.
#      Do NOT load demo-data.sql into a live deployment — every seeded
#      account shares the published password Password123. Create real
#      accounts instead (schema.sql is accounts-free).
#   3. Set the values at first deploy — the Blueprint creation form prompts
#      for DB_URL and DB_PASSWORD; they never appear in git. DB_USER is
#      avnadmin for every Aiven service by default.
services:
  - type: web
    name: sunrise-clinic
    runtime: docker
    dockerfilePath: ./deploy/app/Dockerfile
    healthCheckPath: /help
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "8"
      - key: CLINIC_TIMEZONE
        value: Asia/Colombo